---
# Habilita acesso remoto via RDP (Remote Desktop Protocol) e OpenSSH Server.
# Restringe o acesso RDP ao grupo DTIC e ao usuário de suporte.
# Equivalente Linux: roles/estacao/tasks/210-ssh-server.yml + 220-vnc.yml

# --- RDP (Remote Desktop Protocol) ---

- name: Habilita o serviço de Remote Desktop (TermService)
  ansible.windows.win_service:
    name: TermService
    start_mode: auto
    state: started

- name: Habilita RDP via registro (fDenyTSConnections = 0)
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server
    name: fDenyTSConnections
    data: 0
    type: dword

- name: Habilita autenticação em nível de rede (NLA) para RDP
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp
    name: UserAuthentication
    data: 1
    type: dword

- name: Abre firewall para RDP (porta 3389)
  community.windows.win_firewall_rule:
    name: "RDP-CMC-In"
    localport: 3389
    action: allow
    direction: in
    protocol: TCP
    # Permite apenas de redes de domínio e privadas
    profiles: domain,private
    state: present
    enabled: true

# --- OpenSSH Server ---

- name: Instala o recurso OpenSSH Server
  ansible.windows.win_optional_feature:
    name: OpenSSH.Server~~~~0.0.1.0
    state: present

- name: Inicia e configura autostart do serviço SSH
  ansible.windows.win_service:
    name: sshd
    start_mode: auto
    state: started

- name: Configura shell padrão do SSH como PowerShell
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\OpenSSH
    name: DefaultShell
    data: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    type: string

- name: Abre firewall para SSH (porta 22)
  community.windows.win_firewall_rule:
    name: "SSH-CMC-In"
    localport: 22
    action: allow
    direction: in
    protocol: TCP
    profiles: domain,private
    state: present
    enabled: true
  notify: Restart SSH
