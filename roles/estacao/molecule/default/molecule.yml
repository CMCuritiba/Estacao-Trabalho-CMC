---
# Gerenciamento de dependencias (download de roles/collections)
dependency:
  name: galaxy
  options:
    ignore-certs: false
    ignore-errors: false
driver:
  name: vagrant

platforms:
  - name: estacao
    box: aaronvonawesome/linux-mint-22-cinnamon
    memory: 2048
    cpus: 2
    gui: true
    ssh_connection_options:
      - "-o StrictHostKeyChecking=no"
      - "-o UserKnownHostsFile=/dev/null"

ansible:
  cfg:
    defaults:
      host_key_checking: false
      verbosity: 1
    ssh_connection:
      pipelining: true
  env:
    ANSIBLE_FORCE_COLOR: "1"
    ANSIBLE_LOAD_CALLBACK_PLUGINS: "1"
  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --diff
        - --force-handlers

provisioner:
  name: ansible
  config_options:
      defaults:
        timeout: 60
  inventory:
    links:
      group_vars: ../../../../inventory/group_vars/
verifier:
  name: ansible
lint: |
  set -e
  yamllint .
  ansible-lint .
