---

# Altera tempo de retencao do syslog, auth, messages e outros para 6 meses

- name: Verifica se logrotate do sssd existe
  ansible.builtin.stat:
    path: /etc/logrotate.d/sssd-common
  register: sssd_logrotate

- name: Define arquivos de logrotate para configurar
  ansible.builtin.set_fact:
    logrotate_targets: >-
      {{
        ['/etc/logrotate.d/rsyslog']
        + (['/etc/logrotate.d/sssd-common'] if sssd_logrotate.stat.exists else [])
      }}

- name: Mantém logs por 27 semanas (~6 meses)
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: 'rotate\s+\d+'
    replace: "rotate 27"
  loop: "{{ logrotate_targets }}"

- name: Rotaciona logs para semanal
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: "daily"
    replace: "weekly"
  loop: "{{ logrotate_targets }}"
